name: Daily vulnerability snapshot

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC every day, after EPSS publishes its daily scores
  workflow_dispatch:       # run it by hand from the Actions tab
  push:                    # and whenever the snapshot code itself changes
    paths:
      - scripts/snapshot.py
      - .github/workflows/daily-snapshot.yml

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set commit identity
        run: |
          git config user.name "CallanSM"
          git config user.email "126923185+SMCallan@users.noreply.github.com"

      - name: Snapshot KEV + EPSS and commit each step
        run: python3 scripts/snapshot.py --commit

      - name: Push
        run: |
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
